name: Build

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
        shell: bash

      - name: Prepare platform output
        shell: bash
        run: |
          mkdir -p "dist-${{ matrix.platform }}"
          cp -R dist/. "dist-${{ matrix.platform }}/"

      - name: Upload platform build
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}
          path: dist-${{ matrix.platform }}/
          if-no-files-found: error

  merge-dist:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows build
        uses: actions/download-artifact@v6
        with:
          name: dist-windows
          path: dist/windows

      - name: Download Linux build
        uses: actions/download-artifact@v6
        with:
          name: dist-linux
          path: dist/linux

      - name: Download macOS build
        uses: actions/download-artifact@v6
        with:
          name: dist-macos
          path: dist/macos

      - name: Commit dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist

          if git diff --cached --quiet; then
            echo "No changes in dist."
          else
            git commit -m "build: update compiled distributions"
            git push
          fi
